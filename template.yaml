AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Gmail Reader serverless API — uses a native Lambda handler to keep the HTTP
  integration small and independent of an ASGI framework.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  "com.aws.cloudformation.Context":
    arch: HTTP API v2 -> native Python Lambda -> Secrets Manager + Gmail API
    must:
      - expose only GET /api/v1/validation-code during the controlled smoke test
      - add authorization before exposing the endpoint in production
      - keep OAuth credentials out of parameters and environment variables
    ref:
      - at: docs/AWS_SAM_MIGRATION_STEP_BY_STEP.md
        has: migration steps + design and security constraints
        scope: local

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC compartilhada criada pelo procedimento do loto-bot.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet dual-stack compartilhada criada pelo procedimento do loto-bot.
  GmailOAuthSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the Gmail OAuth credentials.
    AllowedPattern: "^arn:(aws[a-zA-Z-]*)?:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
    ConstraintDescription: Must be a valid AWS Secrets Manager secret ARN.
  SenderEmail:
    Type: String
    Description: Gmail sender address used to filter validation-code messages.
    Default: logincaixa@caixa.gov.br
  SubjectFilter:
    Type: String
    Description: Gmail subject text used to filter validation-code messages.
    Default: Código de Validação
  ActivationCodeRegex:
    Type: String
    Description: Regular expression used to extract the activation code from an email.
    Default: "Código de ativação: \\d+"
  WaitTimeoutSeconds:
    Type: Number
    Description: Maximum time the handler waits for a matching Gmail message.
    Default: 15
    MinValue: 0
    MaxValue: 15

Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 25
    Tracing: Active
    Environment:
      Variables:
        AWS_USE_DUALSTACK_ENDPOINT: "true"
        GMAIL_OAUTH_SECRET_ARN: !Ref GmailOAuthSecretArn
        SENDER_EMAIL: !Ref SenderEmail
        SUBJECT_FILTER: !Ref SubjectFilter
        ACTIVATION_CODE_REGEX: !Ref ActivationCodeRegex
        WAIT_TIMEOUT_SECONDS: !Ref WaitTimeoutSeconds

Resources:
  GmailReaderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: attaches Gmail Reader to the LotoBot VPC while allowing DNS and IPv6 HTTPS egress
        must:
          - VpcId and SubnetId must identify the shared dual-stack LotoBot network
          - keep outbound IPv6 HTTPS for Secrets Manager and Gmail
        mutable: change-with-constraints
    Properties:
      GroupDescription: Outbound access for Gmail Reader in the shared LotoBot VPC
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: HTTPS over IPv6 to AWS and Gmail APIs
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
        - Description: DNS UDP through the VPC resolver
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: DNS TCP through the VPC resolver
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0

  GmailReaderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: returns a validation code through IAM-authorized direct Lambda invocation
        must:
          - do not expose a public HTTP event for the LotoBot integration
          - keep IPv6 enabled because the shared subnet has no IPv4 internet route
    Properties:
      CodeUri: src/
      Handler: lambda_handler.handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref GmailReaderSecurityGroup
        SubnetIds:
          - !Ref SubnetId
        Ipv6AllowedForDualStack: true
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadGoogleOAuthSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GmailOAuthSecretArn

  GmailReaderFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GmailReaderFunction}"
      RetentionInDays: 14

Outputs:
  FunctionArn:
    Description: Lambda ARN consumed by the LotoBot role.
    Value: !GetAtt GmailReaderFunction.Arn
  FunctionName:
    Description: Name of the native Gmail Reader Lambda function.
    Value: !Ref GmailReaderFunction
